<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Xuất Chúng - Quant Screener</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Trader Xuất Chúng</h1>
            <p>Hệ thống định lượng tìm kiếm siêu cổ phiếu</p>
        </header>

        <div class="control-panel glass">
            <div class="input-group">
                <label for="sector-select">Chọn Ngành Cần Quét:</label>
                <select id="sector-select" disabled>
                    <option value="">Đang tải danh sách ngành...</option>
                </select>
            </div>
            <button id="run-btn" disabled>
                <span class="btn-text">Quét Ngành Này</span>
                <div class="spinner" style="display: none;"></div>
            </button>
        </div>

        <div class="status-message" id="status-message"></div>

        <div class="table-container glass" id="table-container" style="display: none;">
            <table id="result-table">
                <thead>
                    <tr>
                        <th>Mã CP</th>
                        <th>ROIC 5 Năm</th>
                        <th>Value Ratio</th>
                        <th>CFO Quality</th>
                        <th>Nợ/Vốn Chủ (5 Năm)</th>
                        <th>Điểm Số</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu sẽ được render tại đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
