<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Xuất Chúng - Quant Screener</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Trader Xuất Chúng</h1>
            <p>Hệ thống định lượng tìm kiếm siêu cổ phiếu</p>
        </header>

        <div class="control-panel glass">
            <div class="input-group">
                <label for="ticker-input">Nhập mã cổ phiếu:</label>
                <input type="text" id="ticker-input" placeholder="VD: FPT, HPG..." style="text-transform: uppercase;">
            </div>
            <button id="run-btn">
                <span class="btn-text">Phân tích</span>
                <div class="spinner" style="display: none;"></div>
            </button>
        </div>

        <div class="status-message" id="status-message"></div>

        <div class="report-container glass" id="report-container" style="display: none;">
            <div class="summary-cards" id="summary-cards">
                <!-- Summary will be injected here -->
            </div>
            
            <div class="charts-grid">
                <div class="chart-wrapper">
                    <canvas id="roicChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="deChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="cfChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="bpChart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="icrChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
